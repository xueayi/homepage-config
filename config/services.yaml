- 资讯:
    - B站热门:
        icon: /icons/bilibili.png
        href: https://www.bilibili.com/v/popular/all
        description: 全站热门视频
        widget:
          type: customapi
          url: https://api.bilibili.com/x/web-interface/popular?ps=8&pn=1
          refreshInterval: 600000
          headers:
            User-Agent: Mozilla/5.0
          display: dynamic-list
          mappings:
            items: data.list
            name: title
            label: stat.view
            format: number
            limit: 8
            target: https://www.bilibili.com/video/{bvid}
    - 知乎日报:
        icon: /icons/zhihu.png
        href: https://daily.zhihu.com/
        description: 每日精选
        widget:
          type: customapi
          url: https://news-at.zhihu.com/api/4/news/latest
          refreshInterval: 1800000
          display: dynamic-list
          mappings:
            items: stories
            name: title
            label: hint
            limit: 8
            target: https://daily.zhihu.com/story/{id}
    - 抖音热点:
        icon: /icons/douyin-fire.png
        href: https://www.douyin.com/hot
        description: 抖音热点榜
        widget:
          type: customapi
          url: https://www.iesdouyin.com/web/api/v2/hotsearch/billboard/word/
          refreshInterval: 900000
          display: dynamic-list
          mappings:
            items: word_list
            name: word
            label: hot_value
            format: number
            limit: 8
